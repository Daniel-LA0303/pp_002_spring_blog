        <div class="flex items-center min-h-screen bg-gradient-to-br from-slate-100 to-white ">
    <div class="container mx-auto">
        <div class="max-w-md mx-auto my-10 bg-white p-5 rounded-md shadow-xl">
            <div class="text-center">
                <h1 class="my-3 text-3xl font-semibold ">Create a category</h1>
            </div>
            <div class="m-7">
                <form action="https://api.web3forms.com/submit" method="POST" id="form">

                    <div class="mb-6">
                        <label for="name" class="block mb-2 text-sm">Name</label>
                        <input type="text" name="name" id="name" placeholder="ex: Docker" required class="w-full px-3 py-2 placeholder-gray-300 border border-gray-300 rounded-md focus:outline-none focus:ring focus:ring-indigo-100 focus:border-indigo-300 " />
                    </div>
                    <div class="mb-6">
                        <label for="description" class="block mb-2 text-sm ">Description</label>
                        <input type="text" name="description" id="description" placeholder="ex: This is a description example" class="w-full px-3 py-2 placeholder-gray-300 border border-gray-300 rounded-md focus:outline-none focus:ring focus:ring-indigo-100 focus:border-indigo-300 " />
                    </div>
                    <div class="mb-6">

                        <label for="color" class="text-sm">Color</label>
                        <input type="text" name="color" id="color" placeholder="ex: #000000" required class="w-full px-3 py-2 placeholder-gray-300 border border-gray-300 rounded-md focus:outline-none focus:ring focus:ring-indigo-100 focus:border-indigo-300 " />
                    </div>
                    <div class="mb-6">
                        <button type="submit" class="w-full px-3 py-2 text-white bg-indigo-500 rounded-md focus:bg-indigo-600 focus:outline-none">Create</button>
                    </div>
                    <p class="text-base text-center text-gray-400" id="result">
                    </p>
                </form>
            </div>
        </div>
