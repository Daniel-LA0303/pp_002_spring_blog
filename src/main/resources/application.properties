spring.application.name=spring_001_blog

server.port=8080

spring.datasource.url=${DB_URL}

#spring.datasource.url=postgresql://127.0.0.1:5432/bf_002_sed_ra_db_blog
spring.datasource.username=${DB_USERNAME}
#spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
#spring.datasource.password=1234
#spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true



#logging.level.org.springframework=OFF
#logging.level.root=OFF
#spring.main.banner-mode=OFF

#spring.datasource.driver-class-name=org.postgresql.Driver
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect



spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000


app.jwt.secret=JRWSecretKey
app.jwt.expiration-in-ms=86400000

app.cloud.s3.accessKey=${S3_ACCESS_KEY}
app.cloud.s3.secretAccessKey=${S3_SECRET_ACCESS_KEY}
app.cloud.s3.region=${S3_REGION}

spring.web.resources.static-locations=classpath:/static/

spring.profiles.active=aws

