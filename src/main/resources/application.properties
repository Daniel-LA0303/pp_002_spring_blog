spring.application.name=spring_001_blog

server.port=8080

spring.datasource.url=${DB_URL}

# db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# pool connection
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# mail
spring.mail.host=${MAILTRAP_HOST}
spring.mail.port=${MAILTRAP_PORT}
spring.mail.username=${MAILTRAP_USER}
spring.mail.password=${MAILTRAP_PASS}
spring.mail.protocol=smtp

app.email.from=${EMAIL_FROM:Daniel-LA Blog}
app.email.frontend-url=${FRONTEND_URL:http://localhost:5173}

# jwt
app.jwt.secret=JRWSecretKey
app.jwt.expiration-in-ms=86400000

# static files
spring.web.resources.static-locations=classpath:/static/

spring.profiles.active=aws

# AWS credentials
aws.s3.access-key=${S3_ACCESS_KEY}
aws.s3.secret-key=${S3_SECRET_ACCESS_KEY}
aws.s3.region=${S3_REGION}

# cloudinary credentials
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


